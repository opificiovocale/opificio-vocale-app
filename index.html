<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#173f3b">
  <meta name="description" content="Opificio Vocale: ascolto, pratiche, manifesti e percorsi per una voce libera di scegliere.">
  <title>Opificio Vocale</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./icon.svg">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <button class="brand" type="button" data-route="home" aria-label="Vai alla Home">
        <span>OPIFICIO</span><span>VOCALE</span>
      </button>
      <button class="install-button" id="installButton" type="button" hidden>Installa</button>
    </header>

    <main id="app" tabindex="-1" aria-live="polite"></main>

    <nav class="bottom-nav" aria-label="Navigazione principale">
      <button type="button" data-route="home" aria-label="Home">
        <span class="nav-icon" aria-hidden="true">⌂</span><span>Home</span>
      </button>
      <button type="button" data-route="manifesti" aria-label="Manifesti">
        <span class="nav-icon" aria-hidden="true">◎</span><span>Manifesti</span>
      </button>
      <button type="button" data-route="audioteca" aria-label="Audioteca">
        <span class="nav-icon" aria-hidden="true">◌</span><span>Audioteca</span>
      </button>
      <button type="button" data-route="percorsi" aria-label="Percorsi">
        <span class="nav-icon" aria-hidden="true">✦</span><span>Percorsi</span>
      </button>
    </nav>
  </div>

  <noscript>Per usare l’app di Opificio Vocale è necessario attivare JavaScript.</noscript>
  <script src="./app.js" defer></script>
</body>
</html>
