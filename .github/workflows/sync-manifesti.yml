name: Sincronizza Manifesti da MailerLite

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/**
      - .github/workflows/sync-manifesti.yml
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write
  pages: write

concurrency:
  group: sync-manifesti
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Scarica il progetto
        uses: actions/checkout@v4

      - name: Prepara Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Leggi le campagne inviate
        env:
          MAILERLITE_API_TOKEN: ${{ secrets.MAILERLITE_API_TOKEN }}
        run: node scripts/sync-mailerlite.mjs

      - name: Pubblica il nuovo archivio
        id: archive
        run: |
          if git diff --quiet -- manifesti.json; then
            echo "Nessun cambiamento da pubblicare."
            exit 0
          fi
          git config user.name "Opificio Vocale Bot"
          git config user.email "actions@users.noreply.github.com"
          git add manifesti.json
          git commit -m "Aggiorna archivio Manifesti"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Aggiorna il sito pubblicato
        if: steps.archive.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          APP_REPOSITORY: ${{ github.repository }}
        run: gh api --method POST "repos/$APP_REPOSITORY/pages/builds" --silent
