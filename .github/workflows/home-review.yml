name: Verifica nuova Home

on:
  pull_request:
    paths:
      - 'app.js'
      - 'styles.css'
      - 'index.html'
      - 'sw.js'
      - 'tests/home-flow-playwright.cjs'
      - '.github/workflows/home-review.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  home-review:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Checkout ramo in esame
        uses: actions/checkout@v4
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: |
          node --check app.js
          node --check studio.js
          node --check studio-edit.js
          node --check tests/home-flow-playwright.cjs
      - name: Installa browser per test
        run: |
          npm install --no-save --no-package-lock playwright
          npx playwright install --with-deps chromium
      - name: Avvia app locale e verifica su tre schermate
        run: |
          python3 -m http.server 8080 --bind 127.0.0.1 > /tmp/opificio-preview.log 2>&1 &
          sleep 2
          node tests/home-flow-playwright.cjs
      - name: Salva screenshot dei test
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: anteprima-home-iphone-ipad-desktop
          path: test-artifacts/
          if-no-files-found: ignore
